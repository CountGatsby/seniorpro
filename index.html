<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SéniorPro - Pesquisa de Lares e Centros de Dia</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <!-- Header -->
    <header class="bg-white border-b py-4 px-8 flex justify-between items-center shadow-sm">
        <h1 class="text-2xl font-bold text-blue-900">SéniorPro</h1>
        <button onclick="alert('Funcionalidade de Login em breve!')" class="text-sm font-semibold text-blue-600 hover:text-blue-800">Área do Proprietário</button>
    </header>

    <!-- Pesquisa -->
    <section class="bg-blue-900 text-white py-12 px-6 text-center">
        <h2 class="text-3xl font-extrabold mb-2">Motor de Busca de Lares e Apoio Domiciliário</h2>
        <p class="text-blue-200 text-sm mb-6">Encontre estruturas residenciais e cuidados de gerontologia em Portugal.</p>
        <div class="max-w-xl mx-auto flex gap-2">
            <input type="text" placeholder="Digite o Concelho ou Nome..." class="w-full p-3 rounded-xl text-slate-800 focus:outline-none" />
            <button class="bg-blue-600 hover:bg-blue-700 font-bold px-6 py-3 rounded-xl transition">Pesquisar</button>
        </div>
    </section>

    <!-- Lista Demonstrativa -->
    <main class="max-w-4xl mx-auto py-10 px-6">
        <h3 class="text-lg font-bold mb-4">Instituições em Destaque</h3>
        <div class="space-y-4">
            <div class="bg-white p-6 rounded-2xl border flex justify-between items-center shadow-sm">
                <div>
                    <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-0.5 rounded-full uppercase">Lar de Idosos</span>
                    <h4 class="text-xl font-bold mt-1">Residência Sénior Amor & Vida</h4>
                    <p class="text-sm text-slate-500">Cascais, Lisboa</p>
                </div>
                <button onclick="alert('Formulário de reivindicação de negócio')" class="bg-amber-50 text-amber-700 border border-amber-200 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-amber-100">Reclamar Negócio</button>
            </div>
        </div>
    </main>
</body>
</html>
